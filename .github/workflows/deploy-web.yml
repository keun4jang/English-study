name: Deploy Web (PWA) to GitHub Pages

# 이 브랜치에 push될 때마다 빌드 → gh-pages 브랜치로 배포.
# (gh-pages 브랜치가 생기면 GitHub Pages가 자동 활성화된다.
#  만약 활성화되지 않으면 Settings → Pages에서 Branch: gh-pages를 한 번만 선택.)
# 배포 후 폰의 PWA는 앱 내 "업데이트 확인" 또는 자동 배너로 새 버전을 받는다.
on:
  push:
    branches: [claude/ai-diary-app-dev-sgdijm, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck & test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build web (PWA)
        env:
          # GitHub Pages 하위 경로(/English-study) 기준으로 자산 경로 설정
          EXPO_WEB_BASE_URL: /English-study
        run: npm run build:web

      - name: Disable Jekyll on Pages
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
